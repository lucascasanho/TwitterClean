name: PowerShell tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-TwitterClean.ps1

      - name: Test PowerShell 7
        shell: pwsh
        run: ./tests/Test-TwitterClean.ps1
